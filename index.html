<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>밤의 계보 — 갱스터 인생 시뮬레이션</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d14;--panel:#171723;--panel2:#1f1f2e;--line:#2e2e44;--txt:#e8e6f0;--dim:#9a97ad;--acc:#ff3d7f;--acc2:#3df0ff;--gold:#ffcc33;--red:#ff4d4d;--green:#4dff9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,.dh{font-family:'Do Hyeon',sans-serif;font-weight:400;letter-spacing:.5px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
canvas[data-crew],canvas[data-fac],canvas[data-player],#ccv,#ccb,.bcv,.ending-canvas,#tcv{image-rendering:auto}
button{font-family:inherit;font-size:13px;background:var(--panel2);color:var(--txt);border:2px solid var(--line);padding:7px 10px;cursor:pointer;border-radius:0;box-shadow:3px 3px 0 #000;transition:transform .05s}
button:hover:not(:disabled){border-color:var(--acc);color:#fff}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sec{background:#123;border-color:var(--acc2);color:var(--acc2)}
button.danger{background:#3a1010;border-color:var(--red);color:#ffb3b3}
input,select{font-family:inherit;background:#000;color:var(--txt);border:2px solid var(--line);padding:7px;font-size:14px}
.hidden{display:none!important}
.px{border:2px solid var(--line);background:var(--panel);box-shadow:4px 4px 0 #000}
#app{max-width:1280px;margin:0 auto;padding:10px}
/* header */
.hdr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;margin-bottom:10px}
.hdr .title{font-family:'Do Hyeon';font-size:22px;color:var(--acc);margin-right:8px;text-shadow:2px 2px 0 #000}
.chip{background:#000;border:1px solid var(--line);padding:3px 8px;font-size:12px;white-space:nowrap}
.chip b{color:var(--gold)}
.bar{display:inline-block;width:70px;height:8px;background:#333;vertical-align:middle;margin-left:4px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0}
.ap{display:inline-block;width:10px;height:10px;margin-left:2px;background:#333;border:1px solid #555}
.ap.on{background:var(--acc2);border-color:var(--acc2)}
.grow{flex:1}
/* layout */
.main{display:grid;grid-template-columns:250px 1fr 340px;gap:10px}
@media(max-width:1000px){.main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-t{font-family:'Do Hyeon';font-size:17px;padding:6px 10px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.pad{padding:10px}
.portrait{display:flex;flex-direction:column;align-items:center;padding:10px;background:linear-gradient(#1b1030,#0b0b14)}
.portrait canvas{width:128px;height:128px;background:radial-gradient(circle at 40% 35%,#3a2440,#0b0b14 70%)}
.rank{font-family:'Do Hyeon';font-size:18px;color:var(--gold)}
.stat{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
.stat span:first-child{width:52px;color:var(--dim)}
.stat .sb{flex:1;height:10px;background:#222;position:relative;border:1px solid #333}
.stat .sb i{position:absolute;left:0;top:0;bottom:0}
.stat b{width:30px;text-align:right}
.items{font-size:12px;color:var(--dim)}
.items div{margin:2px 0}
.items b{color:var(--txt);font-weight:400}
/* map */
.sky{width:100%;height:auto;display:block;border-bottom:2px solid var(--line)}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
@media(max-width:600px){.dgrid{grid-template-columns:repeat(2,1fr)}}
.dcard{border:2px solid var(--line);background:var(--panel2);padding:6px;cursor:pointer;position:relative;display:flex;gap:6px;align-items:center;min-height:62px}
.dcard:hover{border-color:#fff}
.dcard.sel{outline:2px solid var(--acc2);outline-offset:2px}
.dcard .stripe{position:absolute;left:0;top:0;bottom:0;width:5px}
.dcard canvas{width:64px;height:64px;flex:none;margin-left:4px;background:#0b0b14}
.dcard .nm{font-family:'Do Hyeon';font-size:16px}
.dcard .ow{font-size:11px}
.dcard .meta{font-size:11px;color:var(--dim)}
.dpanel{padding:10px;border-top:2px solid var(--line);background:#11111b}
.dpanel .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* tabs */
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{flex:1;box-shadow:none;border:none;border-right:1px solid var(--line);background:transparent;padding:8px 4px;font-family:'Do Hyeon';font-size:15px;color:var(--dim)}
.tabs button.on{background:var(--acc);color:#fff}
.tabc{padding:10px;max-height:560px;overflow:auto}
.opt{border:1px solid var(--line);background:var(--panel2);padding:8px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.opt .d{flex:1;min-width:0}
.opt .d b{font-size:14px}
.opt .d small{display:block;color:var(--dim);font-size:12px}
.opt canvas{width:64px;height:64px;flex:none;background:#0b0b14;border:1px solid #2a2a3a}
.tag{display:inline-block;font-size:11px;padding:0 5px;border:1px solid var(--line);margin-right:3px;color:var(--dim)}
.tag.g{color:var(--green);border-color:#2a6}
.tag.r{color:var(--red);border-color:#a33}
.tag.y{color:var(--gold);border-color:#a83}
.log{max-height:170px;overflow:auto;font-size:12.5px;padding:8px 10px}
.log div{padding:2px 0;border-bottom:1px dashed #222}
.log .good{color:var(--green)}.log .bad{color:#ff8a8a}.log .info{color:var(--acc2)}.log .gold{color:var(--gold)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal .box{max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:16px;background:var(--panel);border:3px solid var(--acc);box-shadow:6px 6px 0 #000}
#modal h2{margin:0 0 8px;color:var(--acc);font-size:24px}
#modal p{margin:6px 0}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bcv{width:100%;border:2px solid var(--line);background:#000}
.bbars{display:flex;gap:10px;margin:8px 0;font-size:12px}
.bbars>div{flex:1}
.bbars .sb{height:12px;background:#222;border:1px solid #444;position:relative}
.bbars .sb i{position:absolute;left:0;top:0;bottom:0;transition:width .3s}
.blog{font-size:13px;min-height:70px;background:#000;padding:6px 8px;border:1px solid var(--line)}
.blog div{animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateX(-6px)}}
.ending-canvas{width:100%;border:2px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000;border:2px solid var(--acc2);padding:8px 14px;z-index:99;font-size:13px;box-shadow:4px 4px 0 #000}
/* title & create */
.screen{max-width:760px;margin:20px auto;padding:20px}
.screen h1{font-size:46px;color:var(--acc);margin:0;text-shadow:4px 4px 0 #000}
.screen .sub{color:var(--dim);margin-bottom:12px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:8px 0 16px}
.choice{border:2px solid var(--line);background:var(--panel2);padding:8px;cursor:pointer}
.choice:hover{border-color:#fff}
.choice.on{border-color:var(--acc);background:#2a1020}
.choice b{font-family:'Do Hyeon';font-size:17px;font-weight:400}
.choice small{display:block;color:var(--dim);font-size:12px}
.step-t{font-family:'Do Hyeon';font-size:20px;margin-top:14px;color:var(--acc2)}
.endgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.endgrid div{border:1px solid var(--line);padding:6px;font-size:12px;background:#000}
.endgrid div.u{border-color:var(--gold);color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px;margin:4px 0;background:var(--panel2);cursor:pointer}
.check canvas{width:64px;height:64px;background:#0b0b14}
</style>
</head>

 const c0=newCrew(cfg.city);c0.loyal=80;c0.amb=R(20,50);c0.fight=R(18,28);c0.rank=1;S.crew.push(c0);S.right=c0.id;c0.guard=start.id;start.guard=c0.id;
 refreshPool();
 addLog(mode==='found'?`${cityName(cfg.city)} ${start.name}. 오늘 ${FAC.mine.name}의 간판이 처음 걸렸다. 이 도시의 모든 조직이 적이다.`:`${cityName(cfg.city)} ${start.name}. ${FAC[cfg.faction].name}의 이름을 걸고, ${S.name}의 이야기가 시작된다.`,'gold');
 addLog(`학창 시절 '${sc.name}'(으)로 유명했던 당신. 동생 ${c0.name}이(가) 첫 식구가 되었다.`,'info');
 UI={tab:'act',selD:start.id};save();renderAll();}
function refreshPool(){S.pool=[];for(let i=0;i<3;i++)S.pool.push(newCrew(S.cur));}
function save(){if(S&&!S.ended)store.set('nightlineage_save',JSON.stringify(S));}
function loadGame(){const s=store.get('nightlineage_save');if(!s)return false;try{S=JSON.parse(s);if(S.customFac)FAC.mine=S.customFac;S.polit=S.polit||{};S.hq=S.hq||{};S.lux=S.lux||{};if(!S.v2){S.districts.forEach(d=>d.income*=2);S.v2=1;}S.remnants=S.remnants||[];S.lovers=S.lovers||[];S.released=S.released||[];S.bonusInc=S.bonusInc||0;[S.look,...S.crew.map(c=>c.look),...S.pool.map(c=>c.look),...S.remnants.map(c=>c.look),...Object.values(S.facs).map(f=>f.look)].forEach(normLook);S.truce=S.truce||0;UI={tab:'act',selD:null};renderAll();return true;}catch(e){return false;}}
function unlocked(){try{return JSON.parse(store.get('nightlineage_end')||'[]')}catch(e){return[]}}
function unlock(id){const u=unlocked();if(!u.includes(id)){u.push(id);store.set('nightlineage_end',JSON.stringify(u));}}

/* ================== 모달 ================== */
const MQ=[];let modalOpen=false;let MH=[];
function mb(label,fn,cls,dis){MH.push(fn);return `<button class="${cls||''}" ${dis?'disabled':''} onclick="MH[${MH.length-1}]()">${label}</button>`;}
function pushModal(r){MQ.push(r);if(!modalOpen)nextModal();}
function nextModal(){const r=MQ.shift();if(!r){modalOpen=false;$('#modal').classList.add('hidden');if(S&&!S.ended)renderAll();return;}
 modalOpen=true;MH=[];$('#modal').classList.remove('hidden');const box=$('#modalBox');box.scrollTop=0;r(box);if(S)try{paintPending(box);}catch(e){}}
function closeModal(){nextModal();}
function simpleModal(title,html,btns){pushModal(box=>{MH=[];const b=(btns||[['확인',()=>closeModal(),'pri']]).map(x=>mb(x[0],x[1],x[2],x[3])).join('');box.innerHTML=`<h2>${title}</h2>${html}<div class="mbtns">${b}</div>`;});}

/* ================== 행동 ================== */
function act(cost,fn){if(!S||S.ended)return;if(S.ap<cost){toast('이번 주 행동력이 없다. [한 주 마감]을 눌러라.');return;}S.ap-=cost;fn();if(!S.ended){checkEnd();save();renderAll();}}
function pay(n){if(S.money<n){toast(`돈이 부족하다 (${fmt(n)} 필요)`);return false;}S.money-=n;return true;}
function cm(){return country(S.cur).mult;}

function doCollect(){const ds=owned(S.cur);if(!ds.length){toast('이 도시에 네 구역이 없다.');return;}if(S.ap>=1)stx().collect++;
 act(1,()=>{let tot=0;ds.forEach(d=>{const g=d.guard?crewById(d.guard):null;let v=d.income*(0.85+Math.random()*.3)*(1+S.st.cha/200+S.rep/400)*(g?(g.perk==='money'?1.3:1.1):1);tot+=v;});
  tot=Math.round(tot);S.money+=tot;heat(1+ds.length*.6);rep(1);addLog(`${cityName(S.cur)} 구역 ${ds.length}곳을 돌며 자릿세 ${fmt(tot)} 수금.`,'good');});}
function doRest(){act(1,()=>{const h=30+(S.items.house?HOUSE[S.items.house].regen:0);S.hp=Math.min(S.maxhp,S.hp+h);addLog(`푹 쉬었다. 체력 +${h}.`,'info');});}
const TRAIN=[
 {id:'mma',name:'MMA 도장 다니기',desc:'싸움 +2~4, 체력 -8',cost:30,fn:()=>{const g=S.st.fight>70?R(1,2):R(2,4);stat('fight',g);S.hp=Math.max(1,S.hp-8);return `MMA 도장에서 굴렀다. 싸움 +${g}`;}},
 {id:'gym',name:'헬스·체력 단련',desc:'최대체력 +3, 싸움 +1',cost:15,fn:()=>{S.maxhp=Math.min(200,S.maxhp+3);stat('fight',1);return '쇠질로 몸을 키웠다. 최대체력 +3, 싸움 +1';}},
 {id:'study',name:'야간대학 공부',desc:'지능 +2~4',cost:25,fn:()=>{const g=R(2,4);stat('brain',g);return `야간대학 강의를 들었다. 지능 +${g}`;}},
 {id:'law',name:'법전 파기',desc:'지능 +1~2, 형량 계산에 유리',cost:20,fn:()=>{stat('brain',R(1,2));S.lawStudy=(S.lawStudy||0)+1;return '형법과 형사소송법을 팠다. 재판에서 써먹을 수 있다.';}},
 {id:'intel',name:'불법 정보 사기',desc:'정보력 +3~5, 수배도 +2',cost:100,fn:()=>{const g=R(3,5);stat('intel',g);heat(2);return `뒷골목 정보상에게 정보를 샀다. 정보력 +${g}`;}},
 {id:'pol',name:'정치인 접대',desc:'정치력 +3~6, 수배도 +1',cost:300,fn:()=>{const g=R(3,6);stat('pol',g);heat(1);return `지역 유력 인사를 접대했다. 정치력 +${g}`;}},
 {id:'cha',name:'후배들과 술자리',desc:'통솔 +2~4, 동생 충성 +3',cost:60,fn:()=>{const g=R(2,4);stat('cha',g);S.crew.forEach(c=>c.loyal=clamp(c.loyal+3,0,100));return `후배들과 밤새 마셨다. 통솔 +${g}`;}},
 {id:'cop',name:'경찰 간부 매수',desc:'수배도 크게 감소 (정치력 30↑ 안전)',cost:-1,fn:()=>{const ok=S.st.pol>=30||Math.random()<.6;if(ok){const g=R(15,25);heat(-g);return `경찰 간부에게 봉투를 건넸다. 수배도 -${g}`;}heat(10);S.crimes+=1;return '매수 시도가 들통났다! 수배도 +10, 전과 +1';}}
];
function copCost(){return Math.round((500+S.heat*20)*country(S.cur).strict);}
function doTrain(id){const t=TRAIN.find(x=>x.id===id);const cost=t.cost<0?copCost():Math.round(t.cost*cm());
 if(S.ap<1){toast('행동력이 없다.');return;}if(S.money<cost){toast(`돈이 부족하다 (${fmt(cost)})`);return;}
 act(1,()=>{S.money-=cost;const msg=t.fn();addLog(msg,'info');});}

/* 의뢰 */
function doJobs(){if(S.ap<1){toast('행동력이 없다.');return;}
 const JT=[
  {n:'빚 받아주기',k:'fight',pay:[150,400],h:4},
  {n:'물건 운반',k:'intel',pay:[300,700],h:7},
  {n:'업소 보호',k:'cha',pay:[100,300],h:2},
  {n:'선거 사무소 경비',k:'pol',pay:[200,500],h:1},
  {n:'경쟁 조직 장부 빼오기',k:'intel',pay:[250,600],h:5},
  {n:'재개발 현장 정리',k:'fight',pay:[300,800],h:8},
  {n:'투자 사기꾼 추적',k:'brain',pay:[200,600],h:2}];
 const jobs=[];const used=new Set();while(jobs.length<3){const j=pick(JT);if(used.has(j.n))continue;used.add(j.n);jobs.push(Object.assign({},j,{diff:R(15,60)+Math.floor(S.week/20),p:Math.round(R(j.pay[0],j.pay[1])*2*cm()*(1+S.rep/60)*(hasPerk('fixer')?1.3:1))}));}
 pushModal(box=>{box.innerHTML=`<h2>📞 들어온 의뢰</h2><p>하나를 고르면 행동력 1을 쓴다.</p>`+jobs.map(j=>{const pr=Math.round(sig((S.st[j.k]-j.diff)/10)*100);
   return `<div class="opt"><div class="d"><b>${j.n}</b><small>필요: ${STATN[j.k]} (내 ${S.st[j.k]}) · 성공률 약 ${pr}% · 보수 ${fmt(j.p)} · 수배도 +${j.h}</small></div>${mb('수락',()=>{closeModal();act(1,()=>runJob(j));})}</div>`}).join('')+`<div class="mbtns">${mb('닫기',closeModal)}</div>`;});}
function runJob(j){const ok=Math.random()<sig((S.st[j.k]-j.diff)/10);
 if(ok){S.money+=j.p;heat(j.h);S.crimes+=.4;rep(2);stat(j.k,1);addLog(`의뢰 '${j.n}' 성공. ${fmt(j.p)} 입금. ${STATN[j.k]} +1`,'good');}
 else{if(j.k==='fight'){const d=R(8,22);S.hp-=d;addLog(`의뢰 '${j.n}' 실패. 얻어맞고 돌아왔다. 체력 -${d}`,'bad');if(S.hp<=0){S.hp=1;}}
  else{heat(j.h+8);addLog(`의뢰 '${j.n}' 실패. 경찰 눈에 띄었다. 수배도 +${j.h+8}`,'bad');}}}

/* 상점 */
function buy(cat,id){const tbl={weapon:WEAPON,armor:ARMOR,car:CAR,house:HOUSE}[cat];const it=tbl[id];
 let cost=Math.round(it.cost*cm()*(cat==='weapon'&&it.gun?country(S.cur).gun:1));
 if(S.items[cat]===id){toast('이미 가지고 있다.');return;}
 if(!pay(cost))return;S.items[cat]=id;if(it.rep)rep(it.rep);if(cat==='weapon'&&it.gun)heat(5);
 addLog(`${it.name} 구입 (${fmt(cost)}).`,'gold');save();renderAll();}
function buyLawyer(t){const L=LAWYER[t];const cost=Math.round(L.cost*cm());if(S.items.lawyer>=t){toast('이미 그 이상의 변호사가 있다.');return;}if(!pay(cost))return;S.items.lawyer=t;addLog(`${L.name}를 고문으로 선임했다.`,'gold');save();renderAll();}
function buyMisc(id){if(id==='phone'){if(S.items.phone)return;if(!pay(Math.round(50*cm())))return;S.items.phone=true;addLog('대포폰을 마련했다. 매주 수배도가 조금 더 빠진다.','gold');}
 if(id==='acc'){if(S.items.accountant)return;if(!pay(Math.round(2000*cm())))return;S.items.accountant=true;addLog('세탁 전문 회계사를 고용했다. 수배도가 더 빨리 식고 사업 수익 +10%.','gold');}
 if(id==='hospital'){const c=Math.round(150*cm());if(S.hp>=S.maxhp){toast('체력이 가득하다.');return;}if(!pay(c))return;S.hp=S.maxhp;addLog('사설 병원에서 치료를 받았다. 체력 회복.','info');}
 save();renderAll();}

/* 사업 */
function buildBiz(did,bid){const d=S.districts[did];if(d.owner!=='P'||d.biz)return;const b=BIZ[bid];const cost=Math.round(b.cost*country(d.city).mult);if(!pay(cost))return;d.biz=bid;addLog(`${cityName(d.city)} ${d.name}에 ${b.name} 개업 (${fmt(cost)}).`,'gold');save();renderAll();}
function bizIncome(){let tot=0,h=0;owned().forEach(d=>{if(d.biz){const b=BIZ[d.biz];tot+=b.inc*country(d.city).mult;h+=b.heat;}});if(S.items.accountant)tot*=1.1;return{inc:Math.round(tot),heat:h};}
function legalCount(){return owned().filter(d=>d.biz&&BIZ[d.biz].legal).length;}
function canRetire(){return S.money>=300000&&legalCount()>=2&&S.heat<30;}

/* 동생 */
function recruit(i){const c=S.pool[i];if(!c)return;if(S.crew.length>=maxCrew()){toast(`통솔이 부족해 더 거느릴 수 없다 (최대 ${maxCrew()}명)`);return;}if(!pay(c.cost))return;S.crew.push(c);S.pool.splice(i,1);addLog(`'${c.nick}' ${c.name}을(를) 식구로 들였다.`,'good');if(!S.right)S.right=c.id;save();renderAll();}
function party(){if(!S.crew.length)return;const c=Math.round(40*S.crew.length*cm());if(S.ap<1){toast('행동력이 없다.');return;}if(S.money<c){toast('돈이 부족하다');return;}
 act(1,()=>{S.money-=c;S.crew.forEach(x=>x.loyal=clamp(x.loyal+R(6,12),0,100));addLog(`동생들과 회식 (${fmt(c)}). 다들 충성이 올랐다.`,'good');});}
function allowance(id){const x=crewById(id);const c=Math.round(100*cm());if(!pay(c))return;x.loyal=clamp(x.loyal+R(10,18),0,100);x.amb=clamp(x.amb-R(0,4),0,100);addLog(`${x.name}에게 용돈 ${fmt(c)}.`,'info');save();renderAll();}
function trainCrew(id){const x=crewById(id);const c=Math.round(120*cm());if(x.injured){toast('부상 중이다.');return;}if(!pay(c))return;const g=R(3,7);x.fight=clamp(x.fight+g,0,95);x.salary+=2;x.injured=1;x.amb=clamp(x.amb+R(0,5),0,100);addLog(`${x.name}을(를) 도장에 보냈다. 싸움 +${g} (1주간 자리 비움)`,'info');save();renderAll();}
function setRight(id){S.right=id;const x=crewById(id);x.loyal=clamp(x.loyal+10,0,100);x.amb=clamp(x.amb+8,0,100);addLog(`${x.name}을(를) 오른팔로 세웠다. 충성은 올랐지만, 야망도 커진다.`,'gold');save();renderAll();}
function fireCrew(id){const x=crewById(id);if(x.guard){const d=S.districts[x.guard];if(d)d.guard=null;}S.crew=S.crew.filter(c=>c.id!==id);if(S.right===id)S.right=S.crew[0]?S.crew[0].id:null;S.crew.forEach(c=>c.loyal=clamp(c.loyal-3,0,100));
 if(x.loyal<40&&Math.random()<.4){heat(12);addLog(`쫓겨난 ${x.name}이(가) 경찰에 입을 열었다는 소문. 수배도 +12`,'bad');}else addLog(`${x.name}을(를) 내보냈다.`,'');save();renderAll();}
function assignGuard(did,cid){const d=S.districts[did];if(d.guard){const o=crewById(d.guard);if(o)o.guard=null;}cid=cid?+cid:null;if(cid){const c=crewById(cid);if(c.guard!=null&&S.districts[c.guard])S.districts[c.guard].guard=null;c.guard=did;}d.guard=cid;save();renderAll();}

/* 도시 이동/진출 */
function travel(cid){if(cid===S.cur)return;const same=CITY[cid].c===CITY[S.cur].c;const c=(S.lux&&S.lux.jet)?0:same?50:400;if(S.ap<1){toast('행동력이 없다.');return;}if(S.money<c){toast('돈이 부족하다');return;}
 customsCheck(cid,()=>act(1,()=>{S.money-=c;S.cur=cid;UI.selD=null;refreshPool();addLog(`${cityName(cid)}(으)로 이동했다.`,'info');}));}
function expand(cid){const c=Math.round(2000*COUNTRY[CITY[cid].c].mult);if(S.rep<30){toast('평판 30 이상이어야 해외/타지 진출이 가능하다.');return;}if(S.ap<1){toast('행동력이 없다.');return;}if(S.money<c){toast(`돈이 부족하다 (${fmt(c)})`);return;}
 customsCheck(cid,()=>act(1,()=>{S.money-=c;S.cities.push(cid);S.cur=cid;UI.selD=null;refreshPool();rep(5);addLog(`${COUNTRY[CITY[cid].c].flag} ${cityName(cid)}에 아지트를 차렸다. 이제 이 도시의 구역을 빼앗아야 한다.`,'gold');}));}

/* ================== 전투 ================== */
function myPower(sel){let p=S.st.fight*1.0+(S.items.weapon?WEAPON[S.items.weapon].atk:0)+(S.items.armor?ARMOR[S.items.armor].def*.4:0)+S.st.cha*.15+S.st.intel*.15;
 sel.forEach(id=>{const c=crewById(id);if(c)p+=crewPow(c)+(c.perk==='blade'?12:0);});p*=0.6+0.4*(S.hp/S.maxhp);return Math.round(p);}
function enemyPower(d){const f=S.facs[d.owner];let p=f.power*1.25+d.def+(d.weak?-15:0)+Math.min(25,S.week/15)+ltPow(ltOf(d));return Math.round(Math.max(10,p));}
function availCrew(){return S.crew.filter(c=>!c.injured);}
let SEL=new Set();
function prepAttack(did){const d=S.districts[did];if(d.owner==='P')return;if(bottomMode()&&(S.facRank<3||d.owner===S.faction)){toast(d.owner===S.faction?'우리 조직 구역이다.':'행동대장부터 습격할 수 있다.');return;}if(S.ap<1){toast('행동력이 없다.');return;}
 SEL=new Set(availCrew().filter(c=>c.guard==null).slice(0,3).map(c=>c.id));
 UI.tac='front';const draw=box=>{MH=[];const l=ltOf(d);if(l&&S.st.intel>=60)l.known=true;if(!tacAllowed(UI.tac,SEL.size))UI.tac='front';const TM=tacMods(UI.tac);const my=Math.round(myPower([...SEL])*TM.my);const en=enemyPower(d)+ltWeakOn(l,[...SEL],'attack')+TM.en;const known=S.st.intel>=35;const p=Math.round(sig((my-en)/12)*100);
  box.innerHTML=`<h2>⚔️ ${d.name} 습격</h2><p>상대: <b style="color:${FAC[d.owner].color}">${FAC[d.owner].name}</b> · 이 구역 주간 수입 ${fmt(d.income)}</p>
  <p class="dh" style="font-size:18px">아군 전력 <span style="color:var(--acc2)">${my}</span> vs 적 전력 <span style="color:var(--red)">${known?en:'??'}</span> ${known?`· 예상 승률 <b style="color:var(--gold)">${p}%</b>`:'<small>(정보력 35↑이면 적 전력이 보인다)</small>'}</p>
  ${l?`<div class="opt" style="border-color:${FAC[d.owner].color}"><canvas width="64" height="64" data-lt="${l.id}"></canvas><div class="d"><b>지휘: ${ltTitle(l)}</b> <span class="tag ${l.lv>=4?'r':'y'}">Lv${l.lv}</span>${l.kills?' <span class="tag r">원수</span>':''}<small>강점 [${LT_STR[l.str].n}] ${LT_STR[l.str].d} · 약점 ${l.known?`<b style="color:var(--gold)">[${LT_WEAK[l.weak].n}]</b> ${LT_WEAK[l.weak].d}`:'???'}</small>${l.hist.length?`<small style="color:#c9a">"${ltTaunt(l)}"</small>`:''}</div></div>
   <div class="row" style="gap:4px;flex-wrap:wrap">${l.known?'':mb(`🕵️ 약점 캐기 (AP1 · ${fmt(Math.round(30*cm()))})`,()=>{closeModal();scoutLt(d.id);})}${l.known&&l.weak==='proud'?mb('🥊 1:1 맞짱 신청 (AP1)',()=>{closeModal();duelLt(d.id);},'pri'):''}${l.known&&l.weak==='greedy'?mb(`💰 매수 (${fmt(Math.round(d.income*6+l.lv*300))})`,()=>{closeModal();bribeLt(d.id);},'pri'):''}${l.known&&l.weak==='drunk'?mb('🍶 술자리 기습 (AP1)',()=>{const sel=[...SEL];closeModal();act(1,()=>startBattle({mode:'attack',d,sel,ambush:true}));},'pri'):''}</div>`:''}
  ${S.hp<S.maxhp*.5?'<p style="color:var(--red)">⚠ 체력이 낮다. 지면 목숨이 위험하다.</p>':''}

function betrayCheck(){for(const c of S.crew.slice()){if(c.loyal<25&&c.amb>55){
  if(!c.warned){if(Math.random()<.25){c.warned=true;addLog(S.st.intel>=30||hasPerk('ear')?`⚠ 정보원: "${c.name}이(가) 다른 조직 사람들과 술을 마신답니다."`:`${c.name}의 눈빛이 요즘 어딘가 다르다.`,'bad');}}
  else if(Math.random()<.35){doBetray(c);return true;}}
 else if(c.loyal>40)c.warned=false;}
 return false;}

 if(isRight){const guard=S.crew.find(x=>x.id!==c.id&&x.loyal>=80&&!x.injured);
  if(S.st.intel>=65||guard){S.hp=Math.max(1,S.hp-30);const d=c.guard!=null?S.districts[c.guard]:null;S.crew=S.crew.filter(x=>x.id!==c.id);S.right=S.crew[0]?S.crew[0].id:null;

   addLog(`오른팔 ${c.name}의 배신. 간신히 살아남았다.`,'bad');}
  else endGame('betray',{name:c.name});return;}
 S.crew=S.crew.filter(x=>x.id!==c.id);
 if(Math.random()<.5&&c.guard!=null){const d=S.districts[c.guard];const f=pick(CITY[d.city].f.filter(x=>x!==S.faction));simpleModal('🐍 변절',`<p><b>${c.name}</b>이(가) 맡던 <b>${d.name}</b>을(를) 통째로 들고 ${FAC[f].name}(으)로 넘어갔다.</p>`);loseDistrict(d,f);}
 else{heat(30);S.crimes+=3;simpleModal('🐍 밀고',`<p><b>${c.name}</b>이(가) 경찰서에 제 발로 걸어 들어갔다. 장부와 날짜가 함께였다.</p><p style="color:var(--red)">수배도 +30, 전과 +3</p>`);}

 if(S.crew.length>=maxCrew()){toast(`통솔이 부족하다 (최대 ${maxCrew()}명)`);return;}if(!pay(c.cost))return;
 S.remnants.splice(i,1);S.crew.push(c);addLog(`${FAC[c.from].name} 출신 ${c.name}을(를) 거뒀다.${c.perk?' 특기 ['+PERKS[c.perk].n+']':''}`,'good');save();renderAll();}

 for(let i=0;i<n;i++){const c=newCrew(city);if(i===0&&!lts.length){c.fight=R(55,78);c.look=JSON.parse(JSON.stringify(S.facs[fac].look));c.nick='전 '+FAC[fac].name+' 간부';c.perk=pick(Object.keys(PERKS));}else{c.fight=R(35,62);c.look.pal.j=FAC[fac].color;if(Math.random()<.6)c.perk=pick(Object.keys(PERKS));}
  c.loyal=R(25,50);c.amb=R(35,90);c.cost=Math.round(c.fight*7*COUNTRY[cc].mult);c.salary=Math.round((15+c.fight/2.5)*COUNTRY[cc].mult);c.from=fac;out.push(c);}
 pickPeople(out,`💀 ${FAC[fac].name} 궤멸 — 잔당 처리`,`간판이 내려간 ${FAC[fac].name}의 남은 식구 ${out.length}명.${lts.length?` 간부 ${lts.map(ltTitle).join(', ')}도 끌려왔다.`:''} 데려갈 놈을 고르고, 나머지는 숙청하거나 풀어준다. 간부를 살려두면 쓸모는 있지만 칼끝이 언제 돌아올지 모른다.`);}
function pickPeople(list,title,intro){const sel=new Set();
 const draw=box=>{MH=[];const free=maxCrew()-S.crew.length;const cost=list.filter(c=>sel.has(c.id)).reduce((a,c)=>a+c.cost,0);
  box.innerHTML=`<h2>${title}</h2><p>${intro}</p><p style="font-size:13px;color:var(--dim)">빈자리 <b style="color:var(--gold)">${Math.max(0,free)-sel.size}</b> / 데려가는 비용 <b style="color:var(--gold)">${fmt(cost)}</b> (보유 ${fmt(S.money)})</p>`+
   list.map(c=>{const on=sel.has(c.id);return `<div class="opt" style="${on?'border-color:var(--gold)':''}"><canvas width="64" height="64" data-cap="${c.id}"></canvas><div class="d"><b>${c.name} '${c.nick}'</b><small>싸움 ${c.fight}${c.perk?' · ['+PERKS[c.perk].n+'] '+PERKS[c.perk].d:''}<br>충성 ${c.loyal} · 야망 ${c.amb} · 영입 ${fmt(c.cost)} · 주급 ${fmt(c.salary)}</small></div>${mb(on?'✔ 데려간다':'숙청 대상',()=>{if(on)sel.delete(c.id);else{if(sel.size>=free){toast(`통솔이 부족하다 (최대 ${maxCrew()}명)`);return;}if(cost+c.cost>S.money){toast('돈이 모자란다');return;}sel.add(c.id);}draw(box);},on?'pri':'')}</div>`;}).join('')+
   `<div class="mbtns">${mb(`결정 — ${sel.size}명 거두고 ${list.length-sel.size}명 숙청`,()=>{finish('purge');},'danger')}${list.length-sel.size?mb(`나머지는 풀어준다`,()=>{finish('free');}):''}</div>`;
  box.querySelectorAll('canvas[data-cap]').forEach(cv=>{const c=list.find(x=>x.id===+cv.dataset.cap);if(c)paintCanvas(cv,c.look);});};
 const finish=mode=>{const took=list.filter(c=>sel.has(c.id)),rest=list.filter(c=>!sel.has(c.id));let spent=0;
  took.forEach(c=>{if(c.ltId&&S.lts[c.ltId]){const l=S.lts[c.ltId];l.captive=false;ltNote(l,`${S.name}의 식구가 됐다`);}});
  rest.forEach(c=>{if(!c.ltId||!S.lts[c.ltId])return;const l=S.lts[c.ltId];l.captive=false;if(mode==='purge'){ltNote(l,`${S.name}에게 숙청당했다`);}else if(!S.facs[l.fac].dead){l.alive=true;l.last='freed';ltNote(l,`${S.name}이(가) 살려 보냈다`);}});
  [...new Set(list.filter(c=>c.ltId).map(c=>S.lts[c.ltId]&&S.lts[c.ltId].fac))].forEach(f=>{if(f&&!S.facs[f].dead&&!facLts(f).length)promoteLt(f);});
  took.forEach(c=>{if(S.crew.length>=maxCrew()||S.money<c.cost)return;S.money-=c.cost;spent+=c.cost;delete c.expire;if(mode==='purge'&&rest.length)c.loyal=clamp(c.loyal+8,0,100);S.crew.push(c);});
  if(rest.length){if(mode==='purge'){rep(2*rest.length);heat(2.5*rest.length);S.crimes+=.4*rest.length;S.crew.forEach(x=>x.loyal=clamp(x.loyal+1,0,100));
    addLog(`${took.length?took.map(c=>c.name).join(', ')+'을(를) 거두고, ':''}나머지 ${rest.length}명은 숙청했다. 소문이 돈다. 평판 +${2*rest.length}, 수배 +${Math.round(2.5*rest.length)}`,'bad');}
   else{rep(-rest.length);S.released=(S.released||[]).concat(rest.map(c=>({name:c.name,fac:c.from,city:S.cur,week:S.week,fight:c.fight,look:c.look})));
    addLog(`${took.length?took.map(c=>c.name).join(', ')+'을(를) 거두고, ':''}나머지 ${rest.length}명은 풀어줬다. 살려준 은혜를 기억할지, 원한을 기억할지.`,'info');}}
  else addLog(`${took.map(c=>c.name).join(', ')}을(를) 모두 거뒀다.`,'good');
  closeModal();save();renderAll();};
 pushModal(draw);}

const ARC_AT=[30,55,80];
function storyCheck(L){loverPrefs(L);if(L.arc>=3||L.aff<ARC_AT[L.arc])return;const st=STORY[L.job][L.arc];L.arc++;
 ev(`📖 ${L.name} — ${st.t} (${L.arc}/3)`,`${lpic(L)}<p>${st.h(L)}</p><div style="clear:both"></div>`,st.o(L).map(([l,f])=>[l,()=>{f();L.aff=clamp(L.aff,0,100);save();}]));}

function msgWeek(){(S.lovers||[]).forEach(L=>{loverPrefs(L);if(L.msg){L.aff=clamp(L.aff-2,0,100);L.msg=null;}const ch=L.stage>=1?.4:.15;if(Math.random()<ch){const m=pick(MSGS);L.msg={t:m[0],o:m[1]};}});}
function replyMsg(id,i){const L=S.lovers.find(x=>x.id===id);if(!L||!L.msg)return;const [txt,d,type]=L.msg.o[i];const lk=TLIKE[L.trait];const tot=d+(lk.talk.includes(type)?2:0);L.aff=clamp(L.aff+tot,0,100);addLog(`📱 ${L.name}에게 "${txt}" — 호감 ${tot>=0?'+':''}${tot}`,tot>=0?'good':'bad');L.msg=null;storyCheck(L);save();renderAll();}

function confess(id){const L=S.lovers.find(x=>x.id===id);if(!L)return;
 act(1,()=>{const p=sig((L.aff-55+S.st.cha/5+(L.trait==='bold'?S.rep/30:0))/8);
  if(Math.random()<p){const old=partner();if(old){old.stage=0;old.aff=clamp(old.aff-40,0,100);addLog(`${old.name}와(과)는 끝났다.`,'bad');}
   L.stage=1;L.since=S.week;S.partner=L.id;simpleModal('💞 연인',`<div class="row" style="gap:12px;align-items:center;flex-wrap:nowrap"><canvas width="96" height="96" data-lover="${L.id}" style="width:96px;height:96px"></canvas><div><p>"...알아요. 당신이 무슨 일 하는지. 그래도 좋아요."</p><p><b>${L.name}</b>이(가) 연인이 됐다.</p><small style="color:var(--gold)">${LJOB[L.job].perk}</small></div></div>`);setTimeout(()=>paintPending($('#modalBox')),0);addLog(`${L.name}와(과) 연인이 됐다.`,'gold');}
  else{L.aff=clamp(L.aff-10,0,100);addLog(`${L.name}: "아직은... 당신을 잘 모르겠어요." 호감 -10`,'bad');}});}
function propose(id){const L=S.lovers.find(x=>x.id===id);if(!L)return;const c=Math.round(1000*cm());if(S.money<c){toast(`반지 값 ${fmt(c)}이 필요하다`);return;}
 act(1,()=>{S.money-=c;if(Math.random()<sig((L.aff-80)/6)){L.stage=2;S.married=true;rep(5);S.maxhp+=10;S.hp=Math.min(S.maxhp,S.hp+20);simpleModal('💍 결혼',`<div class="row" style="gap:12px;align-items:center;flex-wrap:nowrap"><canvas width="96" height="96" data-lover="${L.id}" style="width:96px;height:96px"></canvas><div><p>"이 길 끝이 어디든, 같이 가요."</p><p><b>${L.name}</b>와(과) 결혼했다. 하객석 절반은 형님들, 절반은 형사였다.</p><small style="color:var(--gold)">배우자 효과 ×1.5 · 최대 체력 +10</small></div></div>`);setTimeout(()=>paintPending($('#modalBox')),0);addLog(`${L.name}와(과) 결혼했다.`,'gold');}

const GOODS={cig:{n:'밀수 담배',ic:'🚬',b:20,risk:.5},fake:{n:'짝퉁 명품',ic:'👜',b:70,risk:.8},chip:{n:'빼돌린 반도체',ic:'💾',b:180,risk:1},gun:{n:'총기 부품',ic:'🔩',b:320,risk:2},gold:{n:'금괴',ic:'🥇',b:600,risk:1.2},art:{n:'도난 미술품',ic:'🖼️',b:1400,risk:1.5}};
const GMOD={busan:{cig:.75,gold:1.25,gun:1.5,fake:1.05},seoul:{chip:.7,gold:1.3,fake:1.25,gun:1.6,art:1.15},osaka:{gun:1.7,cig:1.25,fake:1.15,chip:1.1},tokyo:{art:1.35,gun:1.85,chip:.85,gold:1.1},shanghai:{fake:.5,chip:.7,gold:1.05,cig:.8},hongkong:{fake:.6,gold:.75,art:1.45,chip:.9},la:{gun:.5,cig:1.35,art:.85,chip:1.2},ny:{art:1.55,fake:1.4,gun:.7,gold:.95}};
function mktInit(){if(S.mkt)return;S.mkt={};for(const c in CITY){S.mkt[c]={};for(const g in GOODS)S.mkt[c][g]=.85+Math.random()*.3;}S.cargo={};S.tips=[];}
function gPrice(c,g){mktInit();return Math.max(1,Math.round(GOODS[g].b*(GMOD[c][g]||1)*S.mkt[c][g]));}
function cargoCap(){return 10+(S.lux&&S.lux.yacht?20:0)+(S.items.car==='used'?10:S.items.car==='luxury'?20:S.items.car==='super'?15:0)+(S.items.house==='penthouse'||S.items.house==='apt'?10:0);}
function cargoN(){mktInit();return Object.values(S.cargo).reduce((a,b)=>a+b,0);}
function cargoVal(){return Object.keys(S.cargo).reduce((a,g)=>a+S.cargo[g]*GOODS[g].b,0);}
function mktWeek(){mktInit();for(const c in S.mkt)for(const g in S.mkt[c]){let v=S.mkt[c][g];v+=(1-v)*.18+(Math.random()-.5)*.26;S.mkt[c][g]=clamp(v,.45,1.9);}
 (S.tips||[]).forEach(t=>{S.mkt[t.c][t.g]=t.up?R(165,190)/100:R(45,58)/100;});S.tips=[];
 if(Math.random()<.35){const c=pick(Object.keys(CITY)),g=pick(Object.keys(GOODS)),up=Math.random()<.55;const sure=Math.random()<.55+S.st.intel/200;S.tips.push(sure?{c,g,up}:{c,g:pick(Object.keys(GOODS)),up:!up});
  addLog(`📦 정보원: "다음 주 ${cityName(c)}에서 ${GOODS[g].n} 값이 ${up?'폭등':'폭락'}한다더라." ${sure?'':'(믿을 만한지는 모르겠다)'}`,'info');}}
function buyG(g,n){const p=gPrice(S.cur,g);n=Math.min(n,cargoCap()-cargoN(),Math.floor(S.money/p));if(n<=0){toast(cargoN()>=cargoCap()?'더 실을 데가 없다 (차를 사면 늘어난다)':'돈이 모자란다');return;}
 S.money-=p*n;S.cargo[g]=(S.cargo[g]||0)+n;S.mkt[S.cur][g]=clamp(S.mkt[S.cur][g]+.012*n,.45,1.9);save();renderAll();}
function sellG(g,n){const h=S.cargo[g]||0;n=Math.min(n,h);if(n<=0)return;const p=gPrice(S.cur,g);S.money+=p*n;stx().smug+=p*n;S.cargo[g]=h-n;if(!S.cargo[g])delete S.cargo[g];S.mkt[S.cur][g]=clamp(S.mkt[S.cur][g]-.015*n,.45,1.9);heat(.12*GOODS[g].risk*n);S.crimes+=.02*n*GOODS[g].risk;
 addLog(`${GOODS[g].ic} ${GOODS[g].n} ${n}개 처분 +${fmt(p*n)}`,'good');save();renderAll();}
function marketTab(){mktInit();const c=S.cur;const cap=cargoCap(),n=cargoN();
 return `<div class="sec-t" style="padding-left:0">📦 밀수 시장 — ${cityName(c)} <small style="color:var(--dim)">적재 ${n}/${cap}</small></div>
 <p style="font-size:12px;color:var(--dim)">싸게 사서 다른 도시에서 비싸게 판다. 나라를 넘을 때 세관 검색이 있고, 수배도가 높을수록 위험하다. 팔수록 시세가 무너진다.</p>
 ${Object.keys(GOODS).map(g=>{const G=GOODS[g],p=gPrice(c,g),r=p/G.b,h=S.cargo[g]||0;const col=r<.8?'var(--green)':r>1.25?'var(--red)':'var(--dim)';
  return `<div class="opt"><div class="d"><b>${G.ic} ${G.n}</b> <b style="color:${col}">${fmt(p)}</b> <small style="color:${col}">${r<.8?'▼ 쌈':r>1.25?'▲ 비쌈':'보통'}</small><small>보유 ${h} · 위험도 ${'●'.repeat(Math.round(G.risk*2))}</small></div>
  <button onclick="buyG('${g}',1)">+1</button><button onclick="buyG('${g}',5)">+5</button><button onclick="sellG('${g}',1)" ${h?'':'disabled'}>-1</button><button class="pri" onclick="sellG('${g}',${h})" ${h?'':'disabled'}>전부 팔기</button></div>`;}).join('')}`;}
function customsCheck(to,cb){if(!cargoN()){cb();return;}const cross=CITY[to].c!==CITY[S.cur].c;const mx=Math.max(...Object.keys(S.cargo).map(g=>GOODS[g].risk));
 let p=(cross?.13:.035)*mx*(1+S.heat/70)*country(to).strict-S.st.intel/500-(S.items.accountant?.03:0);if(S.lux&&S.lux.jet)p*=.4;p=clamp(p,.01,.6);
 if(Math.random()>p){if(cross)addLog(`세관을 무사히 통과했다. (짐 ${cargoN()}개)`,'info');cb();return;}

 ev(cross?'🛃 세관 검색':'🚔 검문',`<p>${cross?'공항 세관':'고속도로 검문소'}에서 짐을 열라고 한다. 실린 물건 시가 약 <b>${fmt(val)}</b>.</p>`,[

const POLIT=[['구의원 후원',1000],['시장 선거 자금',5000],['국회의원 뒷배',20000]];
const HQ=[['술집 뒷방 아지트',300],['빌딩 한 층',1500],['요새 빌딩',6000]];
const LUX={watch:{n:'⌚ 명품 시계',c:200,d:'평판 +3 · 통솔 +2'},suit:{n:'🤵 맞춤 수트',c:500,d:'평판 +3 · 통솔 +4'},doctor:{n:'🩺 개인 주치의',c:2500,d:'매주 체력 +10 · 동생 부상 빨리 회복'},dojo:{n:'🥋 조직 전용 도장',c:4000,d:'매주 동생 전원 싸움 +0.25'},yacht:{n:'🛥️ 요트',c:8000,d:'평판 +10 · 밀수 적재 +20 · 요트 데이트'},jet:{n:'✈️ 전용기',c:30000,d:'평판 +15 · 도시 이동 무료 · 세관 위험 -60%'}};
function politLv(cid){return ((S.polit||{})[CITY[cid].c])||0;}
function hqLv(cid){return ((S.hq||{})[cid])||0;}
function buyPolit(){const cc=CITY[S.cur].c;S.polit=S.polit||{};const l=S.polit[cc]||0;if(l>=3)return;const c=Math.round(POLIT[l][1]*cm());if(!pay(c))return;S.polit[cc]=l+1;heat(-8);addLog(`${COUNTRY[cc].name}: ${POLIT[l][0]}. 단속이 눈에 띄게 느슨해졌다.`,'gold');save();renderAll();}
function buyHQ(){S.hq=S.hq||{};const l=S.hq[S.cur]||0;if(l>=3)return;const c=Math.round(HQ[l][1]*cm());if(!pay(c))return;S.hq[S.cur]=l+1;rep(2);addLog(`${cityName(S.cur)} 아지트: ${HQ[l][0]}.`,'gold');save();renderAll();}
function buyLux(k){S.lux=S.lux||{};if(S.lux[k])return;const c=Math.round(LUX[k].c*cm());if(!pay(c))return;S.lux[k]=true;
 if(k==='watch'){rep(3);stat('cha',2);}if(k==='suit'){rep(3);stat('cha',4);}if(k==='yacht')rep(10);if(k==='jet')rep(15);addLog(`${LUX[k].n} 구입.`,'gold');save();renderAll();}
function feast(){if(S.feastW===S.week){toast('이번 주엔 이미 잔치를 열었다.');return;}const c=Math.round(300*cm());if(!pay(c))return;S.feastW=S.week;rep(4);heat(-3);addLog(`${cityName(S.cur)} 경로당·시장 상인들에게 잔치를 열었다. 평판 +4, 수배 -3`,'good');save();renderAll();}
function casino(n){const bet=Math.round(n*cm());if(!pay(bet))return;const r=Math.random();let w=0;if(r<.02)w=bet*10;else if(r<.46)w=bet*2;S.money+=w;
 addLog(w?`🎰 바카라 ${w>bet*2?'잭팟! ':''}+${fmt(w-bet)}`:`🎰 바카라. ${fmt(bet)} 날렸다.`,w?'good':'bad');save();renderAll();}
function spendWeek(){const p=politLv(S.cur);if(p)heat(-.5*p);const h=hqLv(S.cur);if(h)S.hp=Math.min(S.maxhp,S.hp+5*h);const L=S.lux||{};
 if(L.doctor){S.hp=Math.min(S.maxhp,S.hp+10);S.crew.forEach(c=>{if(c.injured)c.injured=Math.max(0,c.injured-1);});}if(L.dojo)S.crew.forEach(c=>c.fight=Math.min(85,c.fight+.25));
 owned().filter(d=>d.vassal).forEach(d=>{const c=crewById(d.vassal);if(!c){d.vassal=null;return;}S.money-=Math.round(d.income*.3);c.loyal=clamp(c.loyal+.3,0,100);});}
function spendShop(){const m=cm();const cc=CITY[S.cur].c;const pl=politLv(S.cur),hl=hqLv(S.cur);const L=S.lux||{};
 return `<div class="sec-t" style="padding-left:0">🏛️ 정치 후원 — ${COUNTRY[cc].name}</div><div class="opt"><div class="d"><b>${pl<3?POLIT[pl][0]:'최고 단계'}</b><small>현재 ${pl}/3 · 단계당 체포 확률 -12%, 형량 -8%, 그 나라에서 매주 수배 -0.5</small></div>${pl<3?`<button onclick="buyPolit()" ${S.money<POLIT[pl][1]*m?'disabled':''}>${fmt(Math.round(POLIT[pl][1]*m))}</button>`:''}</div>
 <div class="sec-t" style="padding-left:0">🏚️ 아지트 — ${cityName(S.cur)}</div><div class="opt"><div class="d"><b>${hl<3?HQ[hl][0]:'요새 완성'}</b><small>현재 ${hl}/3 · 단계당 이 도시 방어전 +7, 머물면 매주 체력 +5</small></div>${hl<3?`<button onclick="buyHQ()" ${S.money<HQ[hl][1]*m?'disabled':''}>${fmt(Math.round(HQ[hl][1]*m))}</button>`:''}</div>
 <div class="sec-t" style="padding-left:0">💎 사치 · 투자</div>${Object.keys(LUX).map(k=>{const c=Math.round(LUX[k].c*m);return `<div class="opt"><div class="d"><b>${LUX[k].n}</b><small>${LUX[k].d}</small></div><button onclick="buyLux('${k}')" ${L[k]||S.money<c?'disabled':''}>${L[k]?'보유':fmt(c)}</button></div>`;}).join('')}
 <div class="sec-t" style="padding-left:0">🎉 그 밖에</div><div class="opt"><div class="d"><b>동네 잔치</b><small>평판 +4 · 수배 -3 · 주 1회</small></div><button onclick="feast()" ${S.feastW===S.week?'disabled':''}>${fmt(Math.round(300*m))}</button></div>
 <div class="opt"><div class="d"><b>🎰 바카라</b><small>44% 두 배 · 2% 열 배 · 나머지는 날린다</small></div><button onclick="casino(100)">${fmt(Math.round(100*m))}</button><button onclick="casino(1000)">${fmt(Math.round(1000*m))}</button><button onclick="casino(10000)">${fmt(Math.round(10000*m))}</button></div>`;}

 if(P.v>=100){P.on=false;P.v=0;P.cool=20;S.crimes+=4;heat(30);const lost=Math.round(S.money*.25);S.money-=lost;addLog(`⚖️ 일제 검거. 계좌 ${fmt(lost)} 동결.`,'bad');trial();return true;}

 if(k==='fall'){const c=S.crew.filter(x=>x.id!==S.right).sort((a,b)=>b.loyal-a.loyal)[0];if(!c){toast('대신 들어갈 동생이 없다');return;}
  ev('🧍 바지사장',`<p>${c.name}에게 다 뒤집어쓰고 들어가 달라고 해야 한다. 나오면 한자리 챙겨준다는 약속과 함께.</p>`,[['부탁한다',()=>{removeCrew(c);P.v=Math.max(0,P.v-28);S.crew.forEach(x=>x.loyal=clamp(x.loyal+(c.loyal>=70?2:-5),0,100));S.owed=(S.owed||[]).concat([{name:c.name,back:S.week+40,look:c.look,fight:c.fight}]);addLog(`${c.name}이(가) 모든 걸 안고 들어갔다. 수사 -28. 동생들이 지켜봤다.`,c.loyal>=70?'gold':'bad');},'pri'],['아니다',()=>{}]]);}

  ${S.pool.map((c,i)=>`<div class="opt"><canvas width="64" height="64" data-crew="${c.id}"></canvas><div class="d"><b>${c.name} '${c.nick}'</b><small>${c.perk?`<span class="tag y">${PERKS[c.perk].n}</span>`:''}싸움 ${c.fight} · 충성 ${c.loyal} · 야망 ${S.st.intel>=25?c.amb:'??'} · 급여 ${fmt(c.salary)}</small></div><button onclick="recruit(${i})" ${S.money<c.cost?'disabled':''}>${fmt(c.cost)}</button></div>`).join('')}
  ${(S.remnants||[]).length?`<div class="sec-t" style="padding-left:0">💀 궤멸 조직 잔당 <small style="color:var(--dim)">기한 내 거두지 않으면 흩어짐</small></div>`+S.remnants.map(c=>`<div class="opt" style="flex-wrap:wrap"><canvas width="64" height="64" data-crew="${c.id}"></canvas><div class="d"><b>${c.name} '${c.nick}'</b><small>${c.perk?`<span class="tag y" title="${PERKS[c.perk].d}">${PERKS[c.perk].n}</span>`:''}<span class="tag" style="color:${FAC[c.from].color}">${FAC[c.from].name}</span>싸움 ${c.fight} · 충성 ${c.loyal} · 야망 ${S.st.intel>=25?c.amb:'??'} · ${c.expire-S.week}주 남음</small></div><div class="row" style="width:100%;gap:4px"><button onclick="persuadeRemnant(${c.id})">설득 AP1 (통솔)</button><button class="pri" onclick="recruitRemnant(${c.id})" ${S.money<c.cost?'disabled':''}>영입 ${fmt(c.cost)}</button></div></div>`).join(''):''}
  <div class="sec-t" style="padding-left:0">📋 특기 안내</div><p style="font-size:12px;color:var(--dim)">${Object.values(PERKS).map(p=>`<b style="color:var(--gold)">${p.n}</b> ${p.d}`).join(' · ')}</p>
  <p style="font-size:12px;color:var(--dim)">💡 오른팔은 충성과 함께 야망도 커진다. 오른팔의 충성이 바닥나면 칼끝이 당신을 향한다. 정보력 25↑이면 야망 수치가 보인다.</p>`;}
 if(UI.tab==='love')return loveTab();
 if(UI.tab==='city'){return `<div class="sec-t" style="padding-left:0">🎯 숙적 — ${cityName(S.cur)}의 적 간부</div>${nemesisBoard()}<div class="sec-t" style="padding-left:0">도시</div>`+Object.keys(CITY).map(cid=>{const C=CITY[cid];const has=S.cities.includes(cid);const n=owned(cid).length;const cc=Math.round(2000*COUNTRY[C.c].mult);
  return `<div class="opt"><div class="d"><b>${COUNTRY[C.c].flag} ${C.name}</b><small>${C.f.filter(f=>f!==S.faction).map(f=>`<span style="color:${FAC[f].color}">${FAC[f].name}${S.facs[f].dead?'(궤멸)':''}</span>`).join(' · ')}</small><small>내 구역 ${n}/6 · 물가 ×${COUNTRY[C.c].mult} · 단속 ×${COUNTRY[C.c].strict}</small></div>
  ${cid===S.cur?'<span class="tag y">현재</span>':has?`<button onclick="travel('${cid}')">이동 AP1</button>`:`<button class="sec" onclick="expand('${cid}')" ${S.rep<30?'disabled':''}>진출 ${fmt(cc)}</button>`}</div>`}).join('')+`<p style="font-size:12px;color:var(--dim)">진출은 평판 30 이상 필요. 다른 도시의 내 구역 수입은 동생이 지키면 75%, 무방비면 40%만 상납된다.</p>`;}
 return '';}

/* ================== 타이틀 & 캐릭터 생성 ================== */
function titleScreen(){S=null;closeModalAll();const has=!!store.get('nightlineage_save');const u=unlocked();
 $('#app').innerHTML=`<div class="screen px" style="text-align:center">
  <canvas id="tcv" width="960" height="420" style="width:100%;max-width:640px;border:2px solid var(--line)"></canvas>
  <h1>밤의 계보</h1><div class="sub">한국 · 일본 · 중국 · 미국 — 건달 인생 시뮬레이션</div>
  <div class="row" style="justify-content:center"><button class="pri" onclick="startCreate()">새 인생</button><button onclick="loadGame()" ${has?'':'disabled'}>이어하기</button></div>
  <div class="step-t" style="text-align:left">엔딩 도감 ${u.length}/${Object.keys(ENDINGS).length}</div>
  <div class="endgrid">${Object.keys(ENDINGS).map(k=>`<div class="${u.includes(k)?'u':''}">${u.includes(k)?'★ '+ENDINGS[k].name:'??? '}<br><small style="color:var(--dim)">${ENDINGS[k].hint}</small></div>`).join('')}</div>
  ${lineage().length?`<div class="step-t" style="text-align:left">🩸 계보</div><div style="text-align:left;font-size:13px">${lineage().map(x=>`<div>${x.gen}대 <b>${x.name}</b> · ${x.fac} · ${x.age}세 · ${x.end} · 재산 ${fmt(x.money)}</div>`).join('')}</div>`:''}
  <p style="font-size:12px;color:var(--dim);text-align:left;margin-top:14px">조직명과 인물은 모두 가상이며, 실제 단체·인물과 관계없다.</p></div>`;
 const cv=$('#tcv'),ctx=cv.getContext('2d');let t=0;const looks=[randLook('kr','#e04545'),randLook('jp','#d93030'),randLook('cn','#2fa58e'),randLook('us','#9a4ac0'),randLook('kr','#4a7ce8')];looks[0].weapon='bat';looks[2].weapon='knife';looks[3].weapon='pistol';
 function loop(){if(!document.getElementById('tcv'))return;ctx.setTransform(1,0,0,1,0,0);drawSky(cv,['busan','tokyo','hongkong','ny'][Math.floor(t/120)%4]);ctx.setTransform(2,0,0,2,0,0);looks.forEach((L,i)=>{const b=((t/20|0)+i)%2;drawBody(ctx,L,22+i*90,52-b*2,2,{flip:i>=3,blink:((t/7|0)+i*5)%37===0});});t++;requestAnimationFrame(loop);}loop();}
function startCreate(){CREATE={step:0,mode:'found',fname:'',fcolor:'#e04545',name:'',city:'busan',faction:'bukdu',school:'fighter',look:randLook('kr','#e04545')};CREATE.look.hair='slick';renderCreate();}
function renderCreate(){const c=CREATE;const facs=CITY[c.city].f;if(!facs.includes(c.faction))c.faction=facs[0];
 const sc=SCHOOL.find(s=>s.id===c.school);
 $('#app').innerHTML=`<div class="screen px">
  ${c.heir?`<h1 style="font-size:30px">🩸 ${c.heir.P.gen}대 — ${c.heir.P.pName}의 아들</h1><p style="color:var(--gold)">${c.heir.ks.map(t=>`[${HEIR_T[t].n}] ${HEIR_T[t].d}`).join(' · ')} · 고향 ${cityName(c.heir.P.city)} · ${FAC[c.heir.P.faction].name} · 물려받는 돈 ${fmt(c.heir.P.money)}</p>`:'<h1 style="font-size:32px">새 인생</h1>'}
  <div class="row" style="align-items:flex-start;gap:16px">
   <div style="text-align:center"><div class="row" style="gap:6px;justify-content:center;align-items:flex-end"><canvas id="ccv" width="128" height="128" style="width:256px;height:256px;background:radial-gradient(circle at 40% 35%,#3a2440,#0b0b14 70%);border:2px solid var(--line)"></canvas><canvas id="ccb" width="80" height="148" style="width:120px;height:222px;background:#0b0b14;border:2px solid var(--line)"></canvas></div>
    <div class="row" style="justify-content:center;margin-top:6px;gap:4px">
     <button onclick="cyc('hair')">머리: ${HAIRN[c.look.hair]}</button><button onclick="cyc('outfit')">옷: ${OUTFITN[c.look.outfit]}</button></div>
    <div class="row" style="justify-content:center;margin-top:4px;gap:4px"><button onclick="cyc('beard')">수염: ${BEARDN[c.look.beard]}</button><button onclick="cyc('jaw')">턱선</button></div>
    <div class="row" style="justify-content:center;margin-top:4px;gap:4px"><button onclick="cyc('tattoo')">문신: ${TATN[c.look.tattoo||'none']}</button><button onclick="cyc('eye')">${c.look.eye?'쌍꺼풀':'홑꺼풀'}</button><button onclick="cyc('eyec')">눈동자색</button></div>
    ${['dragon','tiger','koi','hannya','snake','phoenix','peony'].includes(c.look.tattoo)&&!['tank','shirt'].includes(c.look.outfit)?'<div style="font-size:12px;color:var(--gold);margin-top:4px">※ 몸 문신은 흰 러닝·꽃무늬 셔츠에서 보입니다</div>':''}
    <div class="row" style="justify-content:center;margin-top:4px;gap:4px"><button onclick="cyc('h')">머리색</button><button onclick="cyc('s')">피부</button></div>
    <div class="row" style="justify-content:center;margin-top:4px;gap:4px"><button onclick="cyc('glasses')">안경: ${GLASSN[c.look.glasses||'none']}</button><button onclick="cyc('scar')">흉터: ${SCARN[c.look.scar||'none']}</button></div>
    <button style="margin-top:4px" onclick="cyc('rand')">🎲 랜덤</button></div>
   <div style="flex:1;min-width:240px">
    <div class="step-t">이름</div><input id="nm" maxlength="8" placeholder="예: 강철" value="${c.name}" oninput="CREATE.name=this.value" style="width:100%">
    <div class="step-t">스탯 미리보기 — ${sc.name}</div>
    ${Object.keys(STATN).map(k=>`<div class="stat"><span>${STATN[k]}</span><div class="sb"><i style="width:${sc.st[k]}%;background:${STATC[k]}"></i></div><b>${sc.st[k]}</b></div>`).join('')}
    <small style="color:var(--dim)">체력 ${sc.maxhp} · 시작 자금 ${fmt(sc.money)} · 평판 ${sc.rep} · 수배 ${sc.heat}</small>
   </div></div>
  ${c.heir?'<div style="display:none">':''}<div class="step-t">0. 어떻게 시작하나</div>
  <div class="choices"><div class="choice ${c.mode==='bottom'?'on':''}" onclick="CREATE.mode='bottom';CREATE.look.pal.j=FAC[CREATE.faction].color;renderCreate()"><b>🧒 밑바닥부터</b><small>고향 조직의 막내로 들어간다. 심부름 → 조직원 → 행동대원 → 행동대장 → 부두목. 끝내 두목 자리를 물려받으면(또는 빼앗으면) 그 조직의 구역을 통째로 얻는다.</small></div>
   <div class="choice ${c.mode==='found'?'on':''}" onclick="CREATE.mode='found';CREATE.look.pal.j=CREATE.fcolor;renderCreate()"><b>🏴 내 조직 창업</b><small>처음부터 내 조직의 두목이다. 내 간판을 건다. 조직 이름과 색을 직접 정한다. 구역 하나, 동생 하나. 고향 조직 전부가 적이다.</small></div></div>
  ${c.mode==='found'?`<div class="row" style="gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0"><input maxlength="7" placeholder="조직 이름 (예: 흑호파)" value="${c.fname||''}" oninput="CREATE.fname=this.value" style="width:180px">${FCOLORS.map(col=>`<span onclick="CREATE.fcolor='${col}';CREATE.look.pal.j='${col}';renderCreate()" style="display:inline-block;width:26px;height:26px;background:${col};border:3px solid ${c.fcolor===col?'#fff':'#000'};cursor:pointer"></span>`).join('')}</div>`:''}
  <div class="step-t">1. 태어난 곳</div>
  <div class="choices">${Object.keys(CITY).map(k=>`<div class="choice ${c.city===k?'on':''}" onclick="CREATE.city='${k}';CREATE.faction=CITY['${k}'].f[0];CREATE.look.pal.j=CREATE.mode==='found'?CREATE.fcolor:FAC[CREATE.faction].color;renderCreate()"><b>${COUNTRY[CITY[k].c].flag} ${CITY[k].name}</b><small>${COUNTRY[CITY[k].c].name} · 물가 ×${COUNTRY[CITY[k].c].mult} · 단속 ×${COUNTRY[CITY[k].c].strict}</small></div>`).join('')}</div>
  ${c.mode==='bottom'?`<div class="step-t">2. 문을 두드릴 조직 <small style="color:var(--dim);font-size:13px">— 고향 조직만 고를 수 있다</small></div>
  <div class="choices">${facs.map(f=>`<div class="choice ${c.faction===f?'on':''}" onclick="CREATE.faction='${f}';CREATE.look.pal.j=FAC['${f}'].color;renderCreate()" style="border-left:6px solid ${FAC[f].color}"><b>${FAC[f].name}</b><small>${FAC[f].desc}</small></div>`).join('')}</div>`:''}
  ${c.heir?'</div>':''}<div class="step-t">3. 학창 시절 무엇으로 유명했나</div>
  <div class="choices">${SCHOOL.map(s=>`<div class="choice ${c.school===s.id?'on':''}" onclick="CREATE.school='${s.id}';renderCreate()"><b>${s.name}</b><small>${s.desc}</small></div>`).join('')}</div>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button onclick="titleScreen()">뒤로</button><button class="pri" onclick="finishCreate()">이 인생으로 시작 ▶</button></div>
 </div>`;
 const L=JSON.parse(JSON.stringify(c.look));dressLow(L,c.heir?FAC[c.heir.P.faction].color:c.mode==='found'?c.fcolor:FAC[c.faction].color);paintCanvas($('#ccv'),L);const cbv=$('#ccb');const pw=physSize(cbv,120);cbv.width=pw;cbv.height=Math.round(pw*296/160);const cb=cbv.getContext('2d');const k=pw/160;cb.drawImage(spriteCanvas('body',L,{},k),0,0);}
function cyc(k){const L=CREATE.look;const nx=(arr,v)=>arr[(arr.indexOf(v)+1)%arr.length];
 if(k==='hair')L.hair=nx(['short','buzz','slick','regent','bald','punk','long'],L.hair);
 if(k==='outfit')L.outfit=nx(['suit','track','leather','shirt','tank'],L.outfit);
 if(k==='tattoo')L.tattoo=nx(Object.keys(TATN),L.tattoo||'none');
 if(k==='eye')L.eye=L.eye?0:1;
 if(k==='beard')L.beard=nx(['none','stubble','goatee','full'],L.beard);
 if(k==='jaw')L.jaw=(L.jaw+1)%3;
 if(k==='h')L.pal.h=nx(HAIRC,L.pal.h);
 if(k==='s')L.pal.s=nx(SKIN,L.pal.s);
 if(k==='glasses'){const ks=Object.keys(GLASSN);L.glasses=ks[(ks.indexOf(L.glasses||'none')+1)%ks.length];if(L.glasses==='none')L.glasses=false;}
 if(k==='scar'){const ks=Object.keys(SCARN);L.scar=ks[(ks.indexOf(L.scar||'none')+1)%ks.length];if(L.scar==='none')L.scar=false;}
 if(k==='eyec')L.eyeCol=nx(['#4a2a18','#3a2a22','#2a2a3a','#5a3a1a','#6a1a1a','#2a4a6a'],L.eyeCol||'#4a2a18');
 if(k==='rand'){CREATE.look=randLook(CITY[CREATE.city].c,FAC[CREATE.faction].color);}
 renderCreate();}
function finishCreate(){const c=CREATE;const nm=(c.name||'').trim();if(!nm){toast('이름을 지어라.');return;}
 const L=JSON.parse(JSON.stringify(c.look));L.weapon=null;if(c.heir){c.city=c.heir.P.city;c.faction=c.heir.P.faction;if(c.heir.P.custom)FAC.mine=c.heir.P.custom;}newGame({name:nm,city:c.city,faction:c.faction,school:c.school,look:L,mode:c.heir?'legacy':c.mode,fname:(c.fname||'').trim(),fcolor:c.fcolor});if(c.heir)applyHeir(c.heir);}

// 초상화 숨쉬기 애니메이션
setInterval(()=>{if(!S||S.ended)return;const cv=document.getElementById('pcv');if(!cv)return;const blink=(Date.now()/150|0)%24===0;paintCanvas(cv,playerLook(),{blink,old:S.age>=40});},150);
titleScreen();
</script>
</body>
